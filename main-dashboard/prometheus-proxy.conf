server {
    listen 8081;
    
    location / {
        # Proxy to agent's ngrok URL (from van)
        proxy_pass https://fumelike-anabel-sandier.ngrok-free.dev:443;
        proxy_set_header Host fumelike-anabel-sandier.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning "true";
        proxy_set_header User-Agent "Prometheus";
        proxy_ssl_verify off;
        proxy_redirect off;
        proxy_http_version 1.1;
    }
}
