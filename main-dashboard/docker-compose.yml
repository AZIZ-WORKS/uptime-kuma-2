version: '3.8'
services:
  backend:
    build: ./backend
    container_name: dashboard-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-devsecret}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DB_PATH=/data/database.sqlite
      - PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - dashboard-data:/data
    ports:
      - '4000:4000'
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:4000}
    container_name: dashboard-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
      - VITE_WS_URL=${VITE_WS_URL:-http://localhost:4000}
    ports:
      - '5173:5173'
    depends_on:
      - backend

  prometheus-proxy:
    image: nginx:alpine
    container_name: prometheus-proxy
    restart: unless-stopped
    volumes:
      - ./prometheus-proxy.conf:/etc/nginx/conf.d/default.conf

  prometheus:
    image: prom/prometheus:latest
    container_name: dashboard-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./targets.json:/etc/prometheus/targets.json
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:latest
    container_name: dashboard-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

  ngrok-proxy:
    image: nginx:alpine
    container_name: ngrok-proxy
    restart: unless-stopped
    volumes:
      - ./nginx-ngrok-proxy.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '8080:8080'

  ngrok:
    image: ngrok/ngrok:latest
    container_name: dashboard-ngrok
    restart: unless-stopped
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    command: start --all --config /etc/ngrok.yml --log=stdout
    depends_on:
      - backend
      - frontend

volumes:
  dashboard-data:
  prometheus-data:
  grafana-data:



